services:
  - type: web
    name: moodmate-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CLIENT_URL
        sync: false
      - key: EMOTION_SERVICE_URL
        value: https://moodmate-emotion.onrender.com/analyze

  - type: web
    name: moodmate-emotion
    runtime: python
    rootDir: emotion_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: moodmate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://moodmate-backend.onrender.com/api
      - key: VITE_FACE_API_MODEL_URL
        value: https://justadudewhohacks.github.io/face-api.js/models
